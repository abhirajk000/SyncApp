# SyncBridge — sync.abhiraj.xyz (web) + api.sync.abhiraj.xyz (API)
# Install: ln -sf /etc/nginx/sites-available/syncbridge /etc/nginx/sites-enabled/syncbridge

map $http_upgrade $syncbridge_connection_upgrade {
    default upgrade;
    ""      close;
}

# ── Web dashboard: sync.abhiraj.xyz ───────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name sync.abhiraj.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sync.abhiraj.xyz;

    ssl_certificate     /etc/letsencrypt/live/sync.abhiraj.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.abhiraj.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:2000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API: api.sync.abhiraj.xyz ─────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name api.sync.abhiraj.xyz;

    client_max_body_size 1100m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sync.abhiraj.xyz;

    client_max_body_size 1100m;

    ssl_certificate     /etc/letsencrypt/live/sync.abhiraj.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.abhiraj.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:2001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $syncbridge_connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
