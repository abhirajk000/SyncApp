name: SyncBridgeIOS
options:
  bundleIdPrefix: com.syncbridge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 5
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SyncBridgeIOS:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - Assets.xcassets
          - README.md
          - project.yml
          - SyncBridgeIOS.xcodeproj
          - build/**
      - path: Assets.xcassets
        type: folder.assetcatalog
      - path: Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SyncBridge
        PRODUCT_BUNDLE_IDENTIFIER: com.syncbridge.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SyncBridge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: Scan SyncBridge pairing QR codes.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Sync screenshots and photos to your clipboard history.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: RMWSFGFGBJ
        CODE_SIGN_STYLE: Automatic
schemes:
  SyncBridgeIOS:
    build:
      targets:
        SyncBridgeIOS: all
    run:
      config: Debug
    archive:
      config: Release
