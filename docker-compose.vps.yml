# VPS production — shared PostgreSQL, no Postgres container
# Usage: docker compose -f docker-compose.vps.yml up -d --build
#
# Ports (localhost only):
#   Web: 127.0.0.1:2000
#   API: 127.0.0.1:2001
#
# Domains (nginx):
#   sync.abhiraj.xyz      → :2000
#   api.sync.abhiraj.xyz  → :2001

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncbridge-api
    restart: always
    ports:
      - "127.0.0.1:2001:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8080
      LOG_FORMAT: json
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      OBJECT_STORAGE_TYPE: local
      OBJECT_STORAGE_PATH: /opt/syncbridge/storage
      RUN_MIGRATIONS: "true"
      MIGRATIONS_PATH: /app/migrations
      MDNS_ENABLED: "false"
      DB_MAX_CONNS: "5"
      DB_MIN_CONNS: "1"
    volumes:
      - syncbridge_storage:/opt/syncbridge/storage

  web:
    image: nginx:1.27-alpine
    container_name: syncbridge-web
    restart: always
    ports:
      - "127.0.0.1:2000:80"
    volumes:
      - ./clients/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  syncbridge_storage:
    driver: local
